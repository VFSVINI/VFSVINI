name: Generate Star Wars Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Idioma dos textos gerados (pt ou en). Veja scripts/texts.py.
env:
  PROFILE_LANG: pt

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install fonttools

      # A fonte do logo e freeware para uso pessoal: nao fica no repositorio, e baixada aqui.
      # Se o download falhar, os scripts usam a News Cycle (OFL, versionada) e nada quebra.
      - name: Fetch Star Wars lettering font
        continue-on-error: true
        run: |
          curl -fsSL -A "Mozilla/5.0" -e "https://www.dafont.com/sf-distant-galaxy.font"             -o "$RUNNER_TEMP/sf.zip" "https://dl.dafont.com/dl/?f=sf_distant_galaxy"
          unzip -j -o "$RUNNER_TEMP/sf.zip" "SF Distant Galaxy.ttf" -d "$RUNNER_TEMP/sf"
          cp "$RUNNER_TEMP/sf/SF Distant Galaxy.ttf" fonts/SFDistantGalaxy.ttf

      - name: Cards (dossier, languages, badges, missions)
        run: python scripts/gen_cards.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Maxims carousel (reshuffled every run)
        run: python scripts/gen_quotes.py dist

      # Dark theme: green saber eating imperial-gold commits. Light theme: sith red on jedi blue.
      - name: Lightsaber snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#4cff4c&color_dots=#161b22,#5c4b00,#a88a00,#e0b800,#ffe81f
            dist/github-snake.svg?color_snake=#d40000&color_dots=#ebedf0,#b9c8ff,#7f9cff,#3f66e8,#1a3bb3

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
