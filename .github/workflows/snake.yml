name: Generate Star Wars Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ficha do Jedi e Sistema de Linguagens
        run: python scripts/gen_stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Maxims carousel (shuffled every run)
        run: python scripts/gen_quotes.py dist

      # Tema escuro: sabre verde devorando commits em tons de ouro imperial
      # Tema claro: sabre sith vermelho sobre dados em azul jedi
      - name: Gerar a cobrinha (sabre de luz)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#4cff4c&color_dots=#161b22,#5c4b00,#a88a00,#e0b800,#ffe81f
            dist/github-snake.svg?color_snake=#d40000&color_dots=#ebedf0,#b9c8ff,#7f9cff,#3f66e8,#1a3bb3

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
