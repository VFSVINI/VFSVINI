<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80" role="img" aria-label="Citações da galáxia">
<style>
text{font-family:'Franklin Gothic Demi Cond','Franklin Gothic Medium','Arial Narrow','Helvetica Neue',Arial,sans-serif}
.q{fill:#7d8fc9} .a{fill:#b8860b}
@media (prefers-color-scheme: dark){.q{fill:#aab8e8} .a{fill:#ffe81f}}
</style>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.033;0.212;0.246;1" dur="24.0s" repeatCount="indefinite"/><text class="q" x="450" y="38" text-anchor="middle" font-size="22" font-style="italic">“Faça, ou não faça. Tentativa não há.”</text><text class="a" x="450" y="64" text-anchor="middle" font-size="12" letter-spacing="4">— MESTRE YODA</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.283;0.462;0.496;1" dur="24.0s" repeatCount="indefinite"/><text class="q" x="450" y="38" text-anchor="middle" font-size="22" font-style="italic">“Medo é o caminho para o Lado Sombrio.”</text><text class="a" x="450" y="64" text-anchor="middle" font-size="12" letter-spacing="4">— MESTRE YODA</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.533;0.713;0.746;1" dur="24.0s" repeatCount="indefinite"/><text class="q" x="450" y="38" text-anchor="middle" font-size="22" font-style="italic">“Tenho um mau pressentimento sobre este deploy.”</text><text class="a" x="450" y="64" text-anchor="middle" font-size="12" letter-spacing="4">— TODO DEV, SEXTA 17h59</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.783;0.963;0.996;1" dur="24.0s" repeatCount="indefinite"/><text class="q" x="450" y="38" text-anchor="middle" font-size="22" font-style="italic">“Que a Força (e os testes verdes) estejam com você.”</text><text class="a" x="450" y="64" text-anchor="middle" font-size="12" letter-spacing="4">— VFSVINI</text></g>
</svg>
